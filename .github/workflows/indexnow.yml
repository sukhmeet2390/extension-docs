name: IndexNow ping

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

jobs:
  ping:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment
        run: sleep 60

      - name: Fetch sitemap and ping IndexNow
        run: |
          set -euo pipefail
          KEY="809ffcf384f893029c55cac5a66e324f"
          HOST="amrita-labs.com"
          KEY_LOCATION="https://${HOST}/${KEY}.txt"

          SITEMAP=$(curl -sSf "https://${HOST}/sitemap-0.xml")
          URLS=$(echo "$SITEMAP" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -s .)

          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "$KEY_LOCATION" \
            --argjson urlList "$URLS" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urlList}')

          echo "Submitting $(echo "$URLS" | jq length) URLs to IndexNow"

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            -w "\nHTTP %{http_code}\n"
